services:
  mongodb:
    image: mongo:6-jammy
    container_name: mongodb-vuelos
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-vuelos}
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend-net

  admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: priv-admin-backend
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongodb:27017/${MONGO_INITDB_DATABASE:-vuelos}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - admin_logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - backend-net
      - admin-net

  admin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: priv-admin-frontend
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8090}:80"
    depends_on:
      - admin-backend
    networks:
      - admin-net

volumes:
  admin_logs:
  mongodb_data:

networks:
  backend-net:
    driver: bridge
  admin-net:
    driver: bridge
